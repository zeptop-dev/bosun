name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/ui/pnpm-lock.yaml }
      - run: python3 scripts/i18n-check.py web/ui/src/i18n
      - run: cd web/ui && pnpm install --frozen-lockfile && pnpm exec oxlint src && pnpm build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: git ls-files '*.go' | xargs gofmt -l | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -race -timeout 20m -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - name: WARP configuration against both real sing-box distributions
        run: BOSUN_TEST_DOWNLOAD_CORES=1 go test -race ./internal/core/singbox -run '^TestWARPRealConfigs$' -v -timeout 5m
      - name: Real Extended reload accounting and native aggregates
        run: BOSUN_TEST_DOWNLOAD_CORES=1 go test -race ./internal/agent -run '^TestRealExtendedTrafficCheckpointAndAggregates$' -v -timeout 5m
      - name: Isolated Linux forwarding and egress guard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 util-linux python3
          go test -c ./internal/forward -o /tmp/bosun-forward.test
          go test -c ./internal/egressguard -o /tmp/bosun-egress.test
          sudo env BOSUN_NFT_TEST=1 /tmp/bosun-forward.test -test.run '^TestNFTLinuxDualStackRelay$' -test.v -test.timeout 45s
          sudo env BOSUN_NFT_TEST=1 /tmp/bosun-egress.test -test.run '^TestGuardLinuxScopedConnections$' -test.v -test.timeout 45s
      - name: Real private-access cores in isolated Linux namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 util-linux python3 openssl
          go test -c ./internal/privateintegration -o /tmp/bosun-private.test
          sudo env BOSUN_NFT_TEST=1 BOSUN_TEST_DOWNLOAD_CORES=1 /tmp/bosun-private.test -test.run '^TestPrivateAccessLinuxCores$' -test.v -test.timeout 15m
