name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/ui/pnpm-lock.yaml }
      - run: cd web/ui && pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - run: make linux VERSION="${GITHUB_REF_NAME}"
      - run: cd bin && sha256sum bosun-linux-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: bosun ${{ github.ref_name }}
          files: |
            bin/bosun-linux-amd64
            bin/bosun-linux-arm64
            bin/SHA256SUMS

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/login-action@v3
        with: { username: zeptop, password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/zeptop-dev/bosun:${{ github.ref_name }}
            ghcr.io/zeptop-dev/bosun:latest
            zeptop/bosun:${{ github.ref_name }}
            zeptop/bosun:latest
