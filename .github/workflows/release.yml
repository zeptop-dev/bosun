name: release
on:
  push:
    tags: ["v*"]
  # Dry run from the Actions tab: builds the binaries and the multi-arch
  # images exactly as a tag would, publishes nothing. For trying a change
  # to this workflow (an action upgrade) before it has to work on a tag.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  extended-core:
    uses: ./.github/workflows/singbox-extended.yml
    with:
      publish: ${{ github.event_name == 'push' }}
  binaries:
    needs: extended-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/ui/pnpm-lock.yaml }
      - run: python3 scripts/i18n-check.py web/ui/src/i18n
      - run: cd web/ui && pnpm install --frozen-lockfile && pnpm exec oxlint src && pnpm build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      # A tag must clear the same gates as master: a red commit may not ship.
      - run: git ls-files '*.go' | xargs gofmt -l | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -race -timeout 20m ./...
      - name: WARP configuration against both real sing-box distributions
        run: BOSUN_TEST_DOWNLOAD_CORES=1 go test -race ./internal/core/singbox -run '^TestWARPRealConfigs$' -v -timeout 5m
      - name: Real Extended reload accounting and native aggregates
        run: BOSUN_TEST_DOWNLOAD_CORES=1 go test -race ./internal/agent -run '^TestRealExtendedTrafficCheckpointAndAggregates$' -v -timeout 5m
      - name: Real private-access cores in isolated Linux namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 util-linux python3 openssl wireguard-tools
          go test -c ./internal/privateintegration -o /tmp/bosun-private.test
          sudo env BOSUN_NFT_TEST=1 BOSUN_TEST_DOWNLOAD_CORES=1 /tmp/bosun-private.test -test.run '^TestPrivateAccessLinuxCores$' -test.v -test.timeout 15m
      - name: Isolated aggregate service control and real WireGuard
        run: |
          go test -c ./internal/servicecontrol -o /tmp/bosun-service-control.test
          sudo env BOSUN_SERVICE_CONTROL_TEST=1 /tmp/bosun-service-control.test -test.run '^TestServiceControlLinux$' -test.v -test.timeout 2m
      - name: Isolated UFW forwarding ownership and packet flow
        run: |
          sudo apt-get install -y ufw
          go test -c ./internal/wgfirewall -o /tmp/bosun-wgfirewall.test
          sudo env BOSUN_WG_FIREWALL_TEST=1 /tmp/bosun-wgfirewall.test -test.run '^TestUFWForwardingLinux$' -test.v -test.timeout 3m
      - name: Real reverse WireGuard and shared subscriber accounting
        run: |
          go test -c ./internal/reversewg -o /tmp/bosun-reversewg.test
          sudo env BOSUN_REVERSEWG_TEST=1 BOSUN_TEST_DOWNLOAD_CORES=1 /tmp/bosun-reversewg.test -test.run '^TestLinuxTransport$' -test.v -test.timeout 5m
      - run: make linux VERSION="${GITHUB_REF_NAME}"
      - run: scripts/build-geocheck.sh bin
      - name: diagnostic tool schema check
        run: BOSUN_TEST_GEOCHECK="$PWD/bin/geocheck-linux-amd64" go test ./internal/netdiag -run TestInstalledGeoCheckSchema
      - name: diagnostic tool vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary bin/geocheck-linux-amd64
      # Nodes run on Alpine too, and a binary linked against the builder's
      # glibc does not start on musl at all ("no such file or directory").
      - name: binaries are static and built with the pinned Go
        run: |
          want="go$(sed -n 's/^toolchain go//p' go.mod)"
          for f in bin/bosun-linux-* bin/geocheck-linux-*; do
            file "$f"
            file "$f" | grep -q 'statically linked' || { echo "$f is dynamically linked"; exit 1; }
            got="$(go version "$f" | awk '{print $NF}')"
            echo "$f: $got"
            [ "$got" = "$want" ] || { echo "$f was built with $got, not $want"; exit 1; }
          done
      - run: cd bin && sha256sum bosun-linux-* geocheck-linux-* geocheck-LICENSE.txt > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.event_name == 'push'
        with:
          name: bosun ${{ github.ref_name }}
          files: |
            bin/bosun-linux-amd64
            bin/bosun-linux-arm64
            bin/geocheck-linux-amd64
            bin/geocheck-linux-arm64
            bin/geocheck-LICENSE.txt
            bin/SHA256SUMS

  image:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with: { username: zeptop, password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          provenance: false
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/zeptop-dev/bosun:${{ github.ref_name }}
            ghcr.io/zeptop-dev/bosun:latest
            zeptop/bosun:${{ github.ref_name }}
            zeptop/bosun:latest
