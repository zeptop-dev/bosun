name: singbox-extended
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable core package after validation
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: scripts/build-singbox-extended.sh linux amd64 dist
      - run: scripts/build-singbox-extended.sh linux arm64 dist
      - name: Verify runtime and per-user accounting
        run: |
          dist/sing-box-extended-linux-amd64 version
          BOSUN_EXTENDED_TEST_BINARY="$PWD/dist/sing-box-extended-linux-amd64" go test -race ./internal/core/singbox -run 'Test(Extended|WARP)' -v -timeout 3m
          BOSUN_EXTENDED_TEST_BINARY="$PWD/dist/sing-box-extended-linux-amd64" go test -race ./internal/agent -run '^TestRealExtendedTrafficCheckpointAndAggregates$' -v -timeout 3m
          for binary in dist/sing-box-extended-linux-*; do
            file "$binary" | grep -q 'statically linked'
            go version "$binary" | grep -q 'go1.26.9'
          done
          cd dist
          sha256sum sing-box-extended-* > SHA256SUMS
      - name: Verify Linux UID isolation, private permissions and shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 util-linux python3 openssl
          go test -c ./internal/privateintegration -o /tmp/bosun-extended-private.test
          sudo env BOSUN_NFT_TEST=1 BOSUN_EXTENDED_TEST_BINARY="$PWD/dist/sing-box-extended-linux-amd64" /tmp/bosun-extended-private.test -test.run '^TestPrivateAccessLinuxCores/singbox-extended' -test.v -test.timeout 3m
      - uses: actions/upload-artifact@v7
        with:
          name: singbox-extended
          path: dist/*
      - name: Publish a new immutable package
        if: inputs.publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag=singbox-extended-1.14.1-extended-2.7.2-r2
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Package already published; retaining the existing assets.'
          else
            gh release create "$tag" --prerelease \
              --title 'sing-box Extended 1.14.1-extended-2.7.2-r2 (bosun build)' \
              --notes-file dist/sing-box-extended-BUILD.txt dist/*
          fi
