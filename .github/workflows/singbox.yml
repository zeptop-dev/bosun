name: singbox
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable reviewed core package after validation
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.14.1
            package: 1.14.1-r3
          - version: 1.14.4
            package: 1.14.4-r1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: scripts/build-singbox.sh ${{ matrix.version }} linux amd64 dist
      - run: scripts/build-singbox.sh ${{ matrix.version }} linux arm64 dist
      - name: Verify configs, accounting, revocation and private routing
        env:
          BOSUN_SINGBOX_TEST_VERSION: ${{ matrix.version }}
          BOSUN_SINGBOX_TEST_BINARY: ${{ github.workspace }}/dist/sing-box-${{ matrix.package }}-linux-amd64
          BOSUN_COREONLY_TEST_BINARY: ${{ github.workspace }}/dist/sing-box-${{ matrix.package }}-linux-amd64
        run: |
          "$BOSUN_SINGBOX_TEST_BINARY" version
          go test -race ./internal/core/singbox -run '^Test(RealSingbox.*|WARPRealConfigs|CoreOnlyRealSingbox)$' -v -timeout 5m
          for binary in dist/sing-box-${{ matrix.package }}-linux-*; do
            file "$binary" | grep -q 'statically linked'
            go version "$binary" | grep -q 'go1.26.10'
          done
      - name: Verify Linux UID isolation, private permissions and shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 util-linux python3 openssl
          go test -c ./internal/core/singbox -o /tmp/bosun-singbox-compat.test
          sudo env BOSUN_COREONLY_TEST_BINARY="$PWD/dist/sing-box-${{ matrix.package }}-linux-amd64" unshare --net sh -c 'ip link set lo up; ip addr add 10.10.0.2/32 dev lo; exec /tmp/bosun-singbox-compat.test -test.run "^TestCoreOnlyRealSingbox/singbox$" -test.v -test.timeout 2m'
          go test -c ./internal/privateintegration -o /tmp/bosun-singbox-private.test
          sudo env BOSUN_NFT_TEST=1 BOSUN_SINGBOX_TEST_BINARY="$PWD/dist/sing-box-${{ matrix.package }}-linux-amd64" /tmp/bosun-singbox-private.test -test.run '^TestPrivateAccessLinuxCores/singbox' -test.v -test.timeout 5m
          cd dist
          sha256sum sing-box-* > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: singbox-${{ matrix.package }}
          path: dist/*
  publish:
    needs: build
    if: inputs.publish && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: write
    strategy:
      matrix:
        package: [1.14.1-r3, 1.14.4-r1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: singbox-${{ matrix.package }}
          path: dist
      - name: Publish a new immutable package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORE_PACKAGE: ${{ matrix.package }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tag="singbox-$CORE_PACKAGE"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Package already published; retaining the existing assets.'
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "sing-box $CORE_PACKAGE (bosun security build)" \
              --notes-file "sing-box-$CORE_PACKAGE-BUILD.txt" ./*
          fi
