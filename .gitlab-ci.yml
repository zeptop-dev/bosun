# bosun CI: test, build bosun for linux, build sing-box from upstream with the
# stats API tag, publish both to this project's generic package registry.
#
# Package layout (Generic Package Registry):
#   sing-box/<version>/sing-box-<version>-linux-{amd64,arm64}, SHA256SUMS
#   bosun/<tag>/bosun-linux-{amd64,arm64}, SHA256SUMS

stages: [test, build, publish]

variables:
  GOFLAGS: "-mod=mod"
  GOTOOLCHAIN: auto
  SINGBOX_VERSION: "1.14.0"
  REGISTRY: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
  DOCKERHUB_USER: zeptop

default:
  image: golang:1.26
  cache:
    key: gomod
    paths: [.gocache/]
  before_script:
    - export GOMODCACHE="$CI_PROJECT_DIR/.gocache/mod" GOCACHE="$CI_PROJECT_DIR/.gocache/build"

build:web:
  stage: test
  image: node:24
  cache: { key: pnpm, paths: [web/ui/node_modules/] }
  before_script: []
  script:
    - corepack enable && corepack prepare pnpm@9 --activate
    - cd web/ui && pnpm install --frozen-lockfile && pnpm build
  artifacts:
    paths: [web/ui/dist/]
    expire_in: 1 week

test:
  stage: test
  needs: [build:web]
  script:
    - git ls-files "*.go" | xargs gofmt -l | tee /dev/stderr | test -z "$(cat)"
    - go vet ./...
    - go test ./...

build:bosun:
  stage: build
  needs: [build:web, test]
  script:
    - make linux VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - cd bin && sha256sum bosun-linux-* > SHA256SUMS && cat SHA256SUMS
  artifacts:
    paths: [bin/]
    expire_in: 1 week

build:singbox:
  stage: build
  parallel:
    matrix:
      - GOARCH: [amd64, arm64]
  script:
    - scripts/build-singbox.sh "$SINGBOX_VERSION" linux "$GOARCH" dist
    - dist/sing-box-${SINGBOX_VERSION}-linux-${GOARCH} version || true
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# Publishing sing-box is manual (or on tag) because the package version is
# the upstream version and only needs to be uploaded once.
publish:singbox:
  stage: publish
  needs: [build:singbox]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - cd dist && sha256sum sing-box-* > SHA256SUMS && cat SHA256SUMS
    - |
      for f in sing-box-* SHA256SUMS; do
        curl --fail -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$REGISTRY/sing-box/$SINGBOX_VERSION/$f"
        echo " uploaded $f"
      done

publish:bosun:
  stage: publish
  needs: [build:bosun]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      cd bin
      for f in bosun-linux-* SHA256SUMS; do
        curl --fail -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$REGISTRY/bosun/$CI_COMMIT_TAG/$f"
        echo " uploaded $f"
      done

# Multi-arch image to the GitLab registry and Docker Hub (zeptop/bosun).
publish:docker:
  stage: publish
  needs: [test]
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  cache: []
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker context create ci
    - docker buildx create --use ci
    - |
      docker buildx build --platform linux/amd64,linux/arm64 \
        --build-arg VERSION="$CI_COMMIT_TAG" \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" \
        -t "$DOCKERHUB_USER/bosun:$CI_COMMIT_TAG" -t "$DOCKERHUB_USER/bosun:latest" \
        --push .

release:
  stage: publish
  needs: [publish:bosun]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  cache: []
  script:
    - echo "releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "bosun $CI_COMMIT_TAG"
    assets:
      links:
        - name: bosun-linux-amd64
          url: "${REGISTRY}/bosun/${CI_COMMIT_TAG}/bosun-linux-amd64"
        - name: bosun-linux-arm64
          url: "${REGISTRY}/bosun/${CI_COMMIT_TAG}/bosun-linux-arm64"
