# bosun configuration
data_dir: /var/lib/bosun
log_level: info
metrics_listen: 127.0.0.1:9100   # Prometheus text endpoint at /metrics; remove to disable

# Core binaries: leave `binary` empty and bosun installs the newest release it
# has tested into <data_dir>/cores/<core>/<version>/ on first start (see
# `bosun core list`). Set `version` to pin a manifest version, or `binary` to
# use your own build.
cores:
  order: [singbox, xray, mita, hysteria]   # preference when several cores can serve an inbound
  singbox:
    stats_listen: 127.0.0.1:9101
    log_level: warn
  xray:                      # optional; the only core for xhttp, hot user add/remove on vless/vmess/trojan
    version: "26.3.27"       # 26.9.9 breaks REALITY for mihomo/sing-box clients
    api_listen: 127.0.0.1:9102
    log_level: warning
  mita:                      # official mieru server, for mieru nodes
    log_level: INFO
  hysteria:                  # official Hysteria 2 server; one hysteria2 inbound per node, instant user changes
    auth_listen: 127.0.0.1:9103
    stats_listen: 127.0.0.1:9104
    log_level: warn

panel:
  driver: xboard
  xboard:
    url: https://panel.example.com
    token: change-me        # Xboard admin setting "server_token"
    node_id: 1
    node_type: ""           # optional; leave empty to resolve by node_id alone

# Local certificates for inbounds with standard TLS (not needed for REALITY).
certs:
  - server_name: node1.example.com
    cert: /etc/bosun/certs/node1.example.com.crt
    key: /etc/bosun/certs/node1.example.com.key

# Local relay rules (entry -> next hop). With Xboard these come from here;
# a panel that manages forwarding supplies them instead.
forwards:
  - tag: to-landing-us
    port: 24443            # what clients connect to on this relay
    protocol: tcp          # tcp | udp | both
    target: 203.0.113.10:443
