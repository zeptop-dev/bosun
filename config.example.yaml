# bosun configuration
data_dir: /var/lib/bosun
log_level: info
metrics_listen: 127.0.0.1:9100   # Prometheus text endpoint at /metrics; remove to disable

# Core binaries: leave `binary` empty and bosun installs the newest release it
# has tested into <data_dir>/cores/<core>/<version>/ on first start (see
# `bosun core list`). Set `version` to pin a manifest version, or `binary` to
# use your own build.
# min_version: v0.44.2      # refuse any self-update or rollback below this tag

cores:
  order: [singbox, xray, mita, hysteria]   # preference when several cores can serve an inbound
  user: bosun-proxy           # run the cores as this unprivileged account (created on first start)
  # egress_guard: true        # default when user is set: drop core connections to private/metadata/loopback
  # egress_allow: [10.10.0.0/24]   # destinations that stay reachable (a private upstream, a line gateway)
  # registry_token: ghp_...   # token for a private release registry, if the bosun repo is not public
  singbox:
    stats_listen: 127.0.0.1:9101
    log_level: warn
  xray:                      # optional; the only core for xhttp, hot user add/remove on vless/vmess/trojan
    version: "26.3.27"       # 26.9.9 breaks REALITY for mihomo/sing-box clients
    api_listen: 127.0.0.1:9102
    log_level: warning
  mita:                      # official mieru server, for mieru nodes
    log_level: INFO
  hysteria:                  # official Hysteria 2 server; one hysteria2 inbound per node, instant user changes
    auth_listen: 127.0.0.1:9103
    stats_listen: 127.0.0.1:9104
    log_level: warn
  # snell:                   # Surge snell-server (closed source, fetched from Surge on first start); needed for snell inbounds
  #   version: "5.0.0"       # or "4.1.1" for clients without v5 support

# Who owns the desired state.
#   local   - standalone: the built-in web panel edits inbounds/users/forwards
#             and can hand the node to Captain later (default)
#   captain - headless managed mode fixed by this file
#   xboard  - headless Xboard node
panel:
  driver: local
  captain:                   # only for driver: captain
    url: https://captain.example.com
    pair_code: ABCD-EFGH     # from "add node" in Captain; used once, then the token is stored in data_dir
  # driver: xboard
  xboard:
    url: https://panel.example.com
    token: change-me        # Xboard admin setting "server_token"
    node_id: 1
    node_type: ""           # optional; leave empty to resolve by node_id alone

# Built-in web panel. Always on for driver local; optional read-only
# diagnostics for the headless drivers. Put it behind Caddy or an SSH tunnel
# unless cert/key are set.
web:
  listen: ":2053"
  # cert: /etc/bosun/panel.crt
  # key: /etc/bosun/panel.key
  # state_file: /var/lib/bosun/local.json
  # Reverse proxies whose X-Forwarded-For the panel believes (login
  # limiter, allow-list); empty = none.
  # trusted_proxies: ["127.0.0.1"]

# Local certificates for inbounds with standard TLS (not needed for REALITY).
certs:
  - server_name: node1.example.com
    cert: /etc/bosun/certs/node1.example.com.crt
    key: /etc/bosun/certs/node1.example.com.key

# Local relay rules (entry -> next hop). With Xboard these come from here;
# a panel that manages forwarding supplies them instead.
forwards:
  - tag: to-landing-us
    port: 24443            # what clients connect to on this relay
    protocol: tcp          # tcp | udp | both
    target: 203.0.113.10:443
